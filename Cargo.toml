[package]
name = "wax-doc-snippets"
version = "1.0.0"
edition = "2024"
publish = false
license-file = "LICENSE.md"

# Rust counterpart of scripts/runner.js — the shared beekeeper fixture
# snippets pull in with `use runner::snippets_beekeeper_data`.
[lib]
name = "runner"
path = "src/rust/runner.rs"

[dependencies]
hiveio-wax = "2.0.3-rc0"
hiveio-beekeeper = "0.0.2"
hiveio-wax-signers-beekeeper = "0.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "retrieve_block"
path = "src/rust/api/default_api/retrieve_block.rs"

[[bin]]
name = "set_endpoint"
path = "src/rust/api/default_api/set_endpoint.rs"

